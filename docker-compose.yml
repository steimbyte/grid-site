services:
  site-grid:
    image: site-grid:latest
    container_name: site-grid
    ports:
      - "3000:3000"
    volumes:
      - ./sites:/sites
      - ./users:/users
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - FRONTEND_URL=${FRONTEND_URL:-}
    restart: unless-stopped
