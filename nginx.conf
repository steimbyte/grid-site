server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Site preview - uploaded files from /sites
    location /sites/ {
        alias /sites/;
        autoindex on;
        add_header Cache-Control "no-cache";
    }

    # Site viewer - iframe für HTML-Files
    location /view/ {
        alias /sites/;
        default_type text/html;
    }

    # CORS für alle Assets
    location ~* \.(html|htm|css|js|png|jpg|svg|ico)$ {
        expires 1d;
        add_header Cache-Control "public, immutable";
    }
}
